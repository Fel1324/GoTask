<div class="rounded-xl overflow-scroll bg-white max-h-[31.25rem] scrollbar-hidden">
  <div class="p-4 flex gap-1">
    <img src="icons/icon-task-star.svg" alt="">
    <strong class="font-semibold text-lg">Comentar tarefa</strong>
    <img class="ml-auto cursor-pointer" src="icons/icon-close.svg" alt="">
  </div>
  <div class="p-4 border-t border-[#D1D5DB]">
    <strong class="font-semibold text-lg mb-4">Minha nova tarefa</strong>
    <p class="font-semibold text-sm mb-2">Descrição</p>
    <p class="font-normal text-base text-[#374151]">Essa é a minha tarefa para criar um projeto Angular</p>
  </div>
  <div class="p-4">
    <div class="bg-[#F3F4F6] p-5 rounded-xl flex flex-col gap-5">
      <p class="font-bold text-sm">Comentários</p>
      <div class="flex items-start gap-2">
        <div class="flex flex-col w-full gap-1">
          <input
            class="rounded-lg border border-[#D1D5DB] p-3 bg-white flex-1 text-sm font-light"
            type="text"
            placeholder="Adicione um comentário"
          >
          <p class="font-semibold text-sm text-red-500">o campo é obrigatório</p>
        </div>
        <button
          class="py-3 px-4 bg-[#2A89EF] text-white rounded-xl text-sm font-semibold cursor-pointer active:translate-y-1 transition-transform duration-75 shadow-md shadow-blue-500/50"
        >
          Adicionar
        </button>
      </div>
      <div class="flex flex-col gap-5 overflow-scroll max-h-44 scrollbar-hidden">
        @for(comment of _task.comments; track comment.id; let last = $last) {
          <!-- Comment -->
          <div class="{{ `flex flex-col gap-2 ${!last ? 'border-b border-[#D1D5DB]' : ''}` }}">
            <div>
              <p class="font-light text-sm text-[#374151]">{{ comment.description }}</p>
            </div>
            <div class="{{ !last ? 'mb-3' : '' }}">
              <p class="font-semibold text-xs underline underline-offset-2 cursor-pointer">Apagar</p>
            </div>
          </div>
          <!-- End Comment -->
        }
      </div>
    </div>
  </div>
</div>
